<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Trips | Nexus Tours</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="../styles/main.css">

    <style>
        /* ==============================
           SAVED TRIPS PAGE
        ============================== */

        .trips-page {
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* Hero */
        .trips-hero {
            max-width: 1100px;
            margin: 0 auto;
            padding: 90px 25px 50px;
            text-align: center;
        }

        .trips-label {
            color: #00d9ff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .trips-hero h1 {
            font-size: clamp(38px, 6vw, 68px);
            margin: 0;
            color: #f5f7ff;
            line-height: 1.1;
        }

        .trips-hero h1 span {
            background: linear-gradient(90deg, #00d9ff, #7557ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .trips-hero p {
            max-width: 650px;
            margin: 20px auto 0;
            color: #aeb8d0;
            font-size: 17px;
            line-height: 1.7;
        }

        /* Dashboard */
        .trip-dashboard {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 25px;
        }

        /* Top controls */
        .trip-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(120, 130, 180, 0.2);
            border-radius: 18px;
            backdrop-filter: blur(10px);
        }

        .trip-count {
            color: #f5f7ff;
            font-size: 18px;
            font-weight: 600;
        }

        .trip-count #tripCount {
    color: #f5f7ff;
    font-size: 18px;
    font-weight: 600;
}

.trip-count #plural {
    color: #f5f7ff;
    font-size: 18px;
    font-weight: 600;
}

        .control-buttons {
            display: flex;
            gap: 12px;
        }

        .control-btn {
            border: none;
            border-radius: 10px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .refresh-btn {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.14);
        }

        .new-trip-btn {
            color: #07101d;
            background: linear-gradient(90deg, #00d9ff, #7455ff);
        }

        .new-trip-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 217, 255, 0.2);
        }

        /* Trip Grid */
        #tripList {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        /* Trip Card */
        .trip-card {
            overflow: hidden;
            border-radius: 20px;
            background: rgba(25, 28, 48, 0.95);
            border: 1px solid rgba(120, 130, 180, 0.2);
            transition: 0.35s ease;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.18);
        }

        .trip-card:hover {
            transform: translateY(-7px);
            border-color: rgba(0, 217, 255, 0.45);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        /* Image */
        .trip-image {
            height: 190px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #09c6f9, #7b4dff);
        }

        .trip-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .trip-card:hover .trip-image img {
            transform: scale(1.06);
        }

        .image-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(8, 10, 25, 0.65),
                transparent 65%
            );
        }

        .trip-number {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 13px;
            font-weight: 700;
            background: rgba(8, 10, 25, 0.7);
            backdrop-filter: blur(8px);
        }

        /* Card Content */
        .trip-content {
            padding: 22px;
        }

        .trip-content h3 {
            margin: 0 0 10px;
            color: #f5f7ff;
            font-size: 22px;
        }

        .destination {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #00d9ff;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .destination-icon {
            font-size: 17px;
        }

        .trip-id {
            color: #7f89a5;
            font-size: 12px;
            margin-bottom: 18px;
        }

        /* Buttons */
        .trip-actions {
            display: flex;
            gap: 10px;
        }

        .edit-btn,
        .delete-btn {
            flex: 1;
            border: none;
            padding: 11px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: 0.25s ease;
        }

        .edit-btn {
            color: #06101c;
            background: #00d9ff;
        }

        .edit-btn:hover {
            transform: translateY(-2px);
            background: #20e0ff;
        }

        .delete-btn {
            color: #ff8f9d;
            background: rgba(255, 70, 90, 0.1);
            border: 1px solid rgba(255, 70, 90, 0.25);
        }

        .delete-btn:hover {
            color: white;
            background: #e94560;
            transform: translateY(-2px);
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px 25px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.035);
            border: 1px dashed rgba(130, 140, 180, 0.3);
        }

        .empty-icon {
            font-size: 55px;
            margin-bottom: 18px;
        }

        .empty-state h2 {
            color: #f5f7ff;
            margin: 0 0 10px;
        }

        .empty-state p {
            color: #929db8;
            margin-bottom: 25px;
        }

        /* Loading */
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px;
            color: #aeb8d0;
            font-size: 17px;
        }

        .loader {
            width: 38px;
            height: 38px;
            margin: 0 auto 18px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 900px) {
            #tripList {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {
            .trips-hero {
                padding-top: 55px;
            }

            .trip-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .control-buttons {
                width: 100%;
            }

            .control-btn {
                flex: 1;
            }

            #tripList {
                grid-template-columns: 1fr;
            }

            .trip-image {
                height: 210px;
            }
        }
    </style>
</head>


<body>

    <div class="trips-page">

        <!-- =========================
             NAVIGATION
        ========================== -->

        <header class="navbar">

            <div class="logo">
                NEXUS TOURS
            </div>

            <nav class="nav-links">

                <li>
                    <a href="../index.html">Home</a>
                </li>

                <li>
                    <a href="services.html">Services</a>
                </li>

                <li>
                    <a href="tours.html">Tours</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>

            </nav>

        </header>


        <!-- =========================
             HERO
        ========================== -->

        <section class="trips-hero">

            <div class="trips-label">
    🌍 YOUR TRAVEL PLANNER
</div>

            <h1>
                Your <span>Saved Trips</span>
            </h1>

            <p>
                Keep your journeys organized in one place.
                Manage your destinations, update your plans,
                and get ready for your next adventure.
            </p>

        </section>


        <!-- =========================
             DASHBOARD
        ========================== -->

        <main class="trip-dashboard">

            <!-- Controls -->

            <div class="trip-controls">

                <div class="trip-count">
                    <span id="tripCount">0</span>
                    Saved Trip<span id="plural">s</span>
                </div>

                <div class="control-buttons">

                    <button
                        class="control-btn refresh-btn"
                        onclick="loadTrips()">
                        ↻ Refresh
                    </button>

                    <button
                        class="control-btn new-trip-btn"
                        onclick="goToAddTrip()">
                        + Plan New Trip
                    </button>

                </div>

            </div>


            <!-- Trip Cards -->

            <div id="tripList">

                <div class="loading">

                    <div class="loader"></div>

                    Loading your journeys...

                </div>

            </div>

        </main>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        /* =========================
           API URL
        ========================== */

        const API_URL = "http://127.0.0.1:8000/trips";


        /* =========================
           GO TO ADD TRIP
        ========================== */

        function goToAddTrip() {

            window.location.href = "../index.html#add-trip";

        }


        /* =========================
           GET IMAGE FOR DESTINATION
        ========================== */

        function getDestinationImage(destination) {

            const destinationName = destination.toLowerCase().trim();

            const images = {

                "goa": "../images/goa.jpg",

                "pune": "../images/pune.jpg",

                "tirupati": "../images/tirupati.jpg",

                "mumbai": "../images/mumbai.jpg",

                "kerala": "../images/kerala.jpg",

                "delhi": "../images/delhi.jpg",

                "manali": "../images/manali.jpg",

                "jaipur": "../images/jaipur.jpg"

            };

            return images[destinationName] || "../images/default.jpg";

        }


        /* =========================
           LOAD ALL TRIPS
        ========================== */

        function loadTrips() {

            const container =
                document.getElementById("tripList");

            container.innerHTML = `

                <div class="loading">

                    <div class="loader"></div>

                    Loading your journeys...

                </div>

            `;


            fetch(API_URL)

                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Unable to load trips"
                        );

                    }

                    return response.json();

                })

                .then(trips => {

                    displayTrips(trips);

                })

                .catch(error => {

                    console.error(
                        "Error loading trips:",
                        error
                    );

                    container.innerHTML = `

                        <div class="empty-state">

                            <div class="empty-icon">
                                ⚠️
                            </div>

                            <h2>
                                Unable to load trips
                            </h2>

                            <p>
                                Please make sure the FastAPI
                                backend is running on port 8000.
                            </p>

                            <button
                                class="control-btn new-trip-btn"
                                onclick="loadTrips()">
                                Try Again
                            </button>

                        </div>

                    `;

                });

        }


        /* =========================
           DISPLAY TRIPS
        ========================== */

        function displayTrips(trips) {

            const container =
                document.getElementById("tripList");

            const countElement =
                document.getElementById("tripCount");

            const pluralElement =
                document.getElementById("plural");


            /* Update count */

            countElement.textContent = trips.length;

            pluralElement.textContent =
                trips.length === 1 ? "" : "s";


            /* No trips */

            if (trips.length === 0) {

                container.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            🧳
                        </div>

                        <h2>
                            No trips saved yet
                        </h2>

                        <p>
                            Start planning your next adventure
                            and save it here.
                        </p>

                        <button
                            class="control-btn new-trip-btn"
                            onclick="goToAddTrip()">
                            + Plan Your First Trip
                        </button>

                    </div>

                `;

                return;

            }


            /* Clear container */

            container.innerHTML = "";


            /* Create cards */

            trips.forEach((trip, index) => {

                const card =
                    document.createElement("article");

                card.className = "trip-card";


                const image =
                    getDestinationImage(
                        trip.destination
                    );


                card.innerHTML = `

                    <div class="trip-image">

                        <img
                            src="${image}"
                            alt="${escapeHTML(trip.destination)}"
                            onerror="this.style.display='none'"
                        >

                        <div class="image-overlay"></div>

                        <div class="trip-number">
                            ${index + 1}
                        </div>

                    </div>


                    <div class="trip-content">

                        <h3>
                            ${escapeHTML(trip.name)}
                        </h3>


                        <div class="destination">

                            <span class="destination-icon">
                                📍
                            </span>

                            <span>
                                ${escapeHTML(trip.destination)}
                            </span>

                        </div>


                        <div class="trip-id">

                            Trip ID:
                            #${trip.id}

                        </div>


                        <div class="trip-actions">

                            <button
                                class="edit-btn"
                                onclick="editTrip(
                                    ${trip.id},
                                    '${escapeJS(trip.name)}',
                                    '${escapeJS(trip.destination)}'
                                )">

                                ✏ Edit

                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteTrip(${trip.id})">

                                🗑 Delete

                            </button>

                        </div>

                    </div>

                `;


                container.appendChild(card);

            });

        }


        /* =========================
           EDIT TRIP
        ========================== */

        function editTrip(
            id,
            currentName,
            currentDestination
        ) {

            const newName = prompt(
                "Enter new trip name:",
                currentName
            );


            if (newName === null) {

                return;

            }


            if (newName.trim() === "") {

                alert(
                    "Trip name cannot be empty."
                );

                return;

            }


            const newDestination = prompt(
                "Enter new destination:",
                currentDestination
            );


            if (newDestination === null) {

                return;

            }


            if (newDestination.trim() === "") {

                alert(
                    "Destination cannot be empty."
                );

                return;

            }


            fetch(`${API_URL}/${id}`, {

                method: "PUT",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    name: newName.trim(),

                    destination:
                        newDestination.trim()

                })

            })

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Failed to update trip"
                    );

                }

                return response.json();

            })

            .then(data => {

                alert(
                    "Trip updated successfully!"
                );

                loadTrips();

            })

            .catch(error => {

                console.error(
                    "Error updating trip:",
                    error
                );

                alert(
                    "Error updating trip!"
                );

            });

        }


        /* =========================
           DELETE TRIP
        ========================== */

        function deleteTrip(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this trip?"
                );


            if (!confirmed) {

                return;

            }


            fetch(`${API_URL}/${id}`, {

                method: "DELETE"

            })

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Failed to delete trip"
                    );

                }

                return response.json();

            })

            .then(data => {

                alert(
                    data.message ||
                    "Trip deleted successfully!"
                );

                loadTrips();

            })

            .catch(error => {

                console.error(
                    "Error deleting trip:",
                    error
                );

                alert(
                    "Error deleting trip!"
                );

            });

        }


        /* =========================
           SECURITY HELPERS
        ========================== */

        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        function escapeJS(value) {

            return String(value)
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"')
                .replace(/\n/g, "\\n")
                .replace(/\r/g, "\\r");

        }


        /* =========================
           LOAD WHEN PAGE OPENS
        ========================== */

        loadTrips();

    </script>

</body>

</html>
